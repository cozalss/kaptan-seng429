# KAPtan — the whole system on one machine, one command (from the repo root):
#
#   docker compose up -d --build          # first build ~5-10 min; then http://localhost:3100/login
#   docker compose ps                     # api / panel / scheduler "healthy", migrate / seed "exited (0)"
#   docker compose down                   # stop (add -v to drop the database too)
#
# Postgres 16 + pgvector, Redis 7 → migrate (alembic head, owner role) → seed (the recorded demo day, once)
# → API (replay LLM, demo clock) + scheduler → panel (Next.js, http mode, /api/v1 rewritten to the API).
# LOCAL ONLY: the passwords below are fixed local defaults and the API runs with KAPTAN_ENV=dev.
# For a real host use backend/docker-compose.prod.yml + backend/prod.env.example.
#
# Host ports (127.0.0.1 only), overridable: KAPTAN_API_PORT (8000), KAPTAN_PANEL_PORT (3100).
# Postgres and Redis are not published (use `docker compose exec postgres psql -U kaptan_owner kaptan`).
# Today's real data (KAP + Borsa İstanbul prices + live agents, own database volume; replay data untouched):
#   docker compose --env-file live.env --profile live up -d --build      (docs/ops/RUNBOOK.md §1)
name: kaptan-stack

x-local-env: &local-env
  KAPTAN_ENV: dev
  DATABASE_URL: postgresql://kaptan_app:${KAPTAN_APP_PASSWORD:-kaptan-local-app}@postgres:5432/kaptan
  DATABASE_OWNER_URL: postgresql://kaptan_owner:${POSTGRES_PASSWORD:-kaptan-local-owner}@postgres:5432/kaptan
  REDIS_URL: redis://:${REDIS_PASSWORD:-kaptan-local-redis}@redis:6379/0
  # Empty = a random key per API process (dev): restarting the API signs everyone out.
  JWT_SECRET: ${JWT_SECRET:-}
  # Empty = the local passphrase kaptan2026 (dev only).
  PASSPHRASE_HASH: ${PASSPHRASE_HASH:-}
  # true = tek kullanıcı modu: one account, the simple /benim home (KAPTAN_SINGLE_USER=true docker compose …).
  KAPTAN_SINGLE_USER: ${KAPTAN_SINGLE_USER:-false}
  DEMO_MODE: ${DEMO_MODE:-true}
  LLM_MODE: ${LLM_MODE:-replay}
  KAP_LIVE: ${KAP_LIVE:-false}
  PRICES_LIVE: ${PRICES_LIVE:-false}
  CHECKPOINTER: ${CHECKPOINTER:-memory}
  # Live spend + warm-up (live.env): agent runs that reach an LLM per hour / per Istanbul day (0 = no daily
  # cap), KAP history days and price-history shares loaded on the first live start.
  AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-6}
  AGENT_MAX_RUNS_PER_DAY: ${AGENT_MAX_RUNS_PER_DAY:-0}
  LIVE_BACKFILL_DAYS: ${LIVE_BACKFILL_DAYS:-5}
  LIVE_WARMUP_MAX_TICKERS: ${LIVE_WARMUP_MAX_TICKERS:-300}
  # localhost is a secure context for browsers, so the __Host- refresh cookie works over plain http.
  COOKIE_SECURE: "true"
  ALLOWED_ORIGINS: http://localhost:${KAPTAN_PANEL_PORT:-3100},http://127.0.0.1:${KAPTAN_PANEL_PORT:-3100}
  LOGIN_RATE_PER_MINUTE: ${LOGIN_RATE_PER_MINUTE:-5}
  TZ: UTC

x-backend: &backend
  image: kaptan-backend:local
  build: ./backend
  # The LLM keys (GEMINI_API_KEY / DEEPSEEK_API_KEY / GROQ_API_KEY) come from backend/.env when it exists;
  # every variable set under `environment` wins over the file. Replay mode never calls a provider.
  env_file:
    - path: ./backend/.env
      required: false
  environment: *local-env

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kaptan
      POSTGRES_USER: kaptan_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaptan-local-owner}
      KAPTAN_APP_PASSWORD: ${KAPTAN_APP_PASSWORD:-kaptan-local-app}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    volumes:
      - ${KAPTAN_PGDATA:-pgdata}:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaptan_owner -d kaptan"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-kaptan-local-redis}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-kaptan-local-redis}
    volumes:
      - ${KAPTAN_REDISDATA:-redisdata}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # The recorded demo day (tests/fixtures/demo), loaded once; `docker compose run --rm seed seed_demo --force`
  # (or ⚙ Ayarlar → Senaryolar → "Verileri sıfırla" as Yönetici) starts it over.
  seed:
    <<: *backend
    command: ["seed_demo"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    <<: *backend
    command: ["api"]
    ports: ["127.0.0.1:${KAPTAN_API_PORT:-8000}:8000"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 20s
    restart: unless-stopped

  # Under DEMO_MODE only the nightly audit_anchor job runs (verify only).
  scheduler:
    <<: *backend
    command: ["scheduler"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 60s
    restart: unless-stopped

  # Live mode (live.env): the first start loads recent KAP days, the issuer list, price history, the universe
  # and flat P&L days, once (idempotent; ~15-25 min, polite). Exits 0 at once unless KAP_LIVE=true.
  warmup:
    <<: *backend
    command: ["live_warmup"]
    profiles: ["live"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: "no"

  # Live KAP polling + the agent consumer. Both exit 0 unless KAP_LIVE=true.
  ingest_worker:
    <<: *backend
    command: ["ingest_worker"]
    profiles: ["live"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: on-failure

  # Starts after the warm-up: before it the universe is empty and every run would stop at the R03 pre-gate.
  agent_worker:
    <<: *backend
    command: ["agent_worker"]
    profiles: ["live"]
    depends_on:
      warmup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: on-failure

  panel:
    image: kaptan-panel:local
    build:
      context: .
      dockerfile: Dockerfile.panel
      args:
        KAPTAN_API_ORIGIN: http://api:8000
    ports: ["127.0.0.1:${KAPTAN_PANEL_PORT:-3100}:3100"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  # live.env: today's real KAP + prices in their own database, the recorded day above stays untouched.
  pgdata_live: {}
  redisdata_live: {}
