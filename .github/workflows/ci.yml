name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 24: vitest 5 needs >= 22.12 and the landing's jsdom 30 needs >= 22.22.2 / 24.15,
# so the panel's `engines.node >= 20.9` alone is not enough to run the tests.
env:
  NODE_VERSION: "24"

jobs:
  panel:
    name: Panel (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaptan-panel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kaptan-panel/package-lock.json
      # No `npm run build` here: `prebuild` also builds ../kaptan-landing (scripts/sync-landing.mjs).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run

  landing:
    name: Landing (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kaptan-landing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kaptan-landing/package-lock.json
      - run: npm ci
      - run: npm test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned by commit SHA (v2.3.9); the rules and the allowed test fixtures are in .gitleaks.toml.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    name: Backend (lint, types, tests on Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      # Integration tests fail instead of skipping when Postgres/Redis are missing.
      KAPTAN_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kaptan-panel/package-lock.json
      # The contract tests run the panel's own TS (audit chain, selectors) as the oracle.
      - run: npm ci
        working-directory: kaptan-panel
      # Throwaway per-run passwords for the compose services; nothing secret is committed.
      - name: Generate service credentials
        run: |
          for name in POSTGRES_PASSWORD KAPTAN_APP_PASSWORD REDIS_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start Postgres (pgvector) and Redis
        run: docker compose -f docker-compose.yml up -d --wait
      - name: Point the tests at the services
        run: |
          {
            echo "DATABASE_URL=postgresql://kaptan_app:${KAPTAN_APP_PASSWORD}@127.0.0.1:5432/kaptan"
            echo "DATABASE_OWNER_URL=postgresql://kaptan_owner:${POSTGRES_PASSWORD}@127.0.0.1:5432/kaptan"
            echo "TEST_DATABASE_URL=postgresql://kaptan_app:${KAPTAN_APP_PASSWORD}@127.0.0.1:5432/kaptan_test"
            echo "TEST_DATABASE_OWNER_URL=postgresql://kaptan_owner:${POSTGRES_PASSWORD}@127.0.0.1:5432/kaptan_test"
            echo "REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0"
          } >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # FR-38 / NFR-10: any malicious fixture that reaches PROPOSE fails the build (report: reports/redteam.json).
      - name: "Red-team gate: no malicious case proposes"
        run: uv run pytest -m redteam --no-cov -p no:cacheprovider
      - run: uv run pytest --cov-fail-under=90
      # NFR-14 per-module gates (line + branch: [tool.coverage.run] branch = true). WARN-ONLY this wave:
      # risk/, ingest/, brokers/ and domain/ are being changed by other M3 packages. To enforce, drop
      # `continue-on-error` (see backend/README.md "Coverage gates").
      - name: "Coverage gate: risk 100 %"
        continue-on-error: true
        run: uv run coverage report --include="src/kaptan/risk/*" --fail-under=100 --skip-covered
      - name: "Coverage gate: ingest 85 %"
        continue-on-error: true
        run: uv run coverage report --include="src/kaptan/ingest/*" --fail-under=85 --skip-covered
      - name: "Coverage gate: brokers + domain 90 %"
        continue-on-error: true
        run: uv run coverage report --include="src/kaptan/brokers/*,src/kaptan/domain/*" --fail-under=90 --skip-covered
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200

  # NFR-15: the panel's Playwright suite in http mode against the real FastAPI backend (replay, DEMO_MODE).
  # NON-BLOCKING for now (continue-on-error): first runs on GitHub runners, timing still being tuned.
  # Drop `continue-on-error` once it has been green for a week.
  e2e-api:
    name: Panel e2e against the backend (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      DEMO_MODE: "true"
      LLM_MODE: replay
      KAP_LIVE: "false"
      PRICES_LIVE: "false"
      LOGIN_RATE_PER_MINUTE: "600"
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kaptan-panel/package-lock.json
      - name: Generate service credentials
        run: |
          for name in POSTGRES_PASSWORD KAPTAN_APP_PASSWORD REDIS_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start Postgres (pgvector) and Redis
        working-directory: backend
        run: docker compose -f docker-compose.yml up -d --wait
      - name: Point the backend at the services
        run: |
          {
            echo "DATABASE_URL=postgresql://kaptan_app:${KAPTAN_APP_PASSWORD}@127.0.0.1:5432/kaptan"
            echo "DATABASE_OWNER_URL=postgresql://kaptan_owner:${POSTGRES_PASSWORD}@127.0.0.1:5432/kaptan"
            echo "REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0"
          } >> "$GITHUB_ENV"
      - name: Migrate and seed the demo day
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python scripts/seed_demo.py
      - name: Start the API
        working-directory: backend
        run: |
          nohup uv run python -m kaptan.api --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Install the panel and Chromium
        working-directory: kaptan-panel
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (http mode)
        working-directory: kaptan-panel
        run: npm run e2e:api
      - name: API log and service logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/api.log" || true
          docker compose -f backend/docker-compose.yml logs --tail=200
