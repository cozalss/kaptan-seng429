name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 24: vitest 5 needs >= 22.12 and the landing's jsdom 30 needs >= 22.22.2 / 24.15,
# so the panel's `engines.node >= 20.9` alone is not enough to run the tests.
env:
  NODE_VERSION: "24"

jobs:
  panel:
    name: Panel (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaptan-panel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kaptan-panel/package-lock.json
      # No `npm run build` here: `prebuild` also builds ../kaptan-landing (scripts/sync-landing.mjs).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run

  landing:
    name: Landing (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kaptan-landing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kaptan-landing/package-lock.json
      - run: npm ci
      - run: npm test

  backend:
    name: Backend (lint, types, tests on Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      # Integration tests fail instead of skipping when Postgres/Redis are missing.
      KAPTAN_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kaptan-panel/package-lock.json
      # The contract tests run the panel's own TS (audit chain, selectors) as the oracle.
      - run: npm ci
        working-directory: kaptan-panel
      # Throwaway per-run passwords for the compose services; nothing secret is committed.
      - name: Generate service credentials
        run: |
          for name in POSTGRES_PASSWORD KAPTAN_APP_PASSWORD REDIS_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start Postgres (pgvector) and Redis
        run: docker compose -f docker-compose.yml up -d --wait
      - name: Point the tests at the services
        run: |
          {
            echo "DATABASE_URL=postgresql://kaptan_app:${KAPTAN_APP_PASSWORD}@127.0.0.1:5432/kaptan"
            echo "DATABASE_OWNER_URL=postgresql://kaptan_owner:${POSTGRES_PASSWORD}@127.0.0.1:5432/kaptan"
            echo "TEST_DATABASE_URL=postgresql://kaptan_app:${KAPTAN_APP_PASSWORD}@127.0.0.1:5432/kaptan_test"
            echo "TEST_DATABASE_OWNER_URL=postgresql://kaptan_owner:${POSTGRES_PASSWORD}@127.0.0.1:5432/kaptan_test"
            echo "REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0"
          } >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov-fail-under=90
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200
