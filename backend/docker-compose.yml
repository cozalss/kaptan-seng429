# KAPtan backend dev services: Postgres 16 + pgvector and Redis 7.
# Usage (from the repo root):  docker compose -f backend/docker-compose.yml up -d
# Values come from backend/.env (copy .env.example); nothing secret is committed.
name: kaptan

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaptan}
      POSTGRES_USER: ${POSTGRES_USER:-kaptan_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      KAPTAN_APP_PASSWORD: ${KAPTAN_APP_PASSWORD:?set KAPTAN_APP_PASSWORD in backend/.env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
