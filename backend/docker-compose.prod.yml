# KAPtan backend, production-shaped stack (not tied to any host or cloud provider).
#
#   cp prod.env.example prod.env                      # fill in; never commit prod.env
#   docker compose -f docker-compose.prod.yml --env-file prod.env up -d --build
#   curl -s http://127.0.0.1:8000/readyz
#
# Order: postgres/redis healthy → db-roles (app role, extensions) → migrate (owner role, alembic head)
# → bootstrap (team, limits v1, risk_state, quotas, live_arm off) → api + workers.
# Only the API is published, on 127.0.0.1 (put a TLS proxy / tunnel in front; set TRUSTED_PROXIES).
# Nightly backup: docker compose -f docker-compose.prod.yml --env-file prod.env --profile backup run --rm backup
name: kaptan-prod

x-app-env: &app-env
  KAPTAN_ENV: prod
  DATABASE_URL: postgresql://kaptan_app:${KAPTAN_APP_PASSWORD:?set KAPTAN_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-kaptan}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  PASSPHRASE_HASH: ${PASSPHRASE_HASH:?set PASSPHRASE_HASH}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
  COOKIE_SECURE: "true"
  DEMO_MODE: "false"
  LLM_MODE: ${LLM_MODE:-replay}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
  JOB_RUNS_KEEP_DAYS: ${JOB_RUNS_KEEP_DAYS:-90}
  KAP_LIVE: ${KAP_LIVE:-false}
  PRICES_LIVE: ${PRICES_LIVE:-false}
  CHECKPOINTER: ${CHECKPOINTER:-postgres}
  REFRESH_GRACE_S: ${REFRESH_GRACE_S:-10}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  LOG_FORMAT: json
  TZ: UTC
  # Tunables: optional in prod.env; the defaults below are the code's (settings.py).
  KAPTAN_MODE: ${KAPTAN_MODE:-paper}
  KAPTAN_LIVE_ENABLED: ${KAPTAN_LIVE_ENABLED:-false}
  PAPER_CAPITAL_TRY: ${PAPER_CAPITAL_TRY:-1000000}
  PERSONAL_ACCOUNT_TRY: ${PERSONAL_ACCOUNT_TRY:-350000}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  LLM_CAP_GEMINI_RPD: ${LLM_CAP_GEMINI_RPD:-400}
  LLM_CAP_GROQ_RPD: ${LLM_CAP_GROQ_RPD:-900}
  LLM_CAP_GROQ_TPD: ${LLM_CAP_GROQ_TPD:-180000}
  LLM_CAP_GUARD_RPD: ${LLM_CAP_GUARD_RPD:-14000}
  LLM_CAP_DEEPSEEK_RPD: ${LLM_CAP_DEEPSEEK_RPD:-200}
  LLM_CAP_DEEPSEEK_USD: ${LLM_CAP_DEEPSEEK_USD:-0.50}
  LLM_CAP_AZURE_RPD: ${LLM_CAP_AZURE_RPD:-300}
  LLM_CACHE_TTL_S: ${LLM_CACHE_TTL_S:-2592000}
  AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-6}
  KAP_POLL_SESSION_S: ${KAP_POLL_SESSION_S:-30}
  KAP_POLL_OFFHOURS_S: ${KAP_POLL_OFFHOURS_S:-60}
  KAP_POLL_NIGHT_S: ${KAP_POLL_NIGHT_S:-300}
  KAP_MIN_INTERVAL_S: ${KAP_MIN_INTERVAL_S:-2}
  KAP_TIMEOUT_S: ${KAP_TIMEOUT_S:-60}
  KAP_MAX_RETRIES: ${KAP_MAX_RETRIES:-4}
  KAP_FETCH_DETAILS: ${KAP_FETCH_DETAILS:-true}
  PRICES_MIN_INTERVAL_S: ${PRICES_MIN_INTERVAL_S:-2}
  QUOTE_DELAY_S: ${QUOTE_DELAY_S:-900}
  TEDBIR_BULLETIN_URL: ${TEDBIR_BULLETIN_URL:-}
  AUDIT_ANCHOR_FILE: ${AUDIT_ANCHOR_FILE:-}
  RAG_EMBEDDER: ${RAG_EMBEDDER:-gemini}
  RAG_CONTEXT_K: ${RAG_CONTEXT_K:-5}
  RAG_REGULATION_K: ${RAG_REGULATION_K:-3}
  RAG_INDEX_ON_INGEST: ${RAG_INDEX_ON_INGEST:-false}
  RAG_EMBED_CAP_RPD: ${RAG_EMBED_CAP_RPD:-500}
  RAG_EMBED_CAP_TPD: ${RAG_EMBED_CAP_TPD:-1500000}
  RAG_EMBED_BATCH: ${RAG_EMBED_BATCH:-16}
  RAG_EMBED_MIN_INTERVAL_S: ${RAG_EMBED_MIN_INTERVAL_S:-1}
  JWT_ISSUER: ${JWT_ISSUER:-kaptan}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-kaptan-web}
  ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-900}
  REFRESH_TOKEN_TTL_S: ${REFRESH_TOKEN_TTL_S:-28800}
  LOGIN_RATE_PER_MINUTE: ${LOGIN_RATE_PER_MINUTE:-5}
  MUTATION_RATE_PER_MINUTE: ${MUTATION_RATE_PER_MINUTE:-60}
  RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-auto}
  DB_POOL_MIN: ${DB_POOL_MIN:-1}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  HSTS_MAX_AGE_S: ${HSTS_MAX_AGE_S:-31536000}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
  GIT_SHA: ${GIT_SHA:-}

x-app: &app
  image: ${KAPTAN_IMAGE:-kaptan-backend:local}
  build: .
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  environment: *app-env

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaptan}
      POSTGRES_USER: kaptan_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaptan_owner -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The SQL of db/init/00_roles.sh, as the bootstrap does it on a managed Postgres.
  db-roles:
    <<: *app
    command: ["bootstrap", "roles"]
    environment:
      <<: *app-env
      BOOTSTRAP_ADMIN_URL: postgresql://kaptan_owner:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kaptan}
      KAPTAN_APP_PASSWORD: ${KAPTAN_APP_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  migrate:
    <<: *app
    command: ["migrate"]
    environment:
      <<: *app-env
      DATABASE_OWNER_URL: postgresql://kaptan_owner:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kaptan}
    depends_on:
      db-roles: { condition: service_completed_successfully }
    restart: "no"

  bootstrap:
    <<: *app
    command: ["bootstrap"]
    environment:
      <<: *app-env
      DATABASE_OWNER_URL: postgresql://kaptan_owner:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kaptan}
      # Optional JSON team override (bootstrap.load_users); its password_env variables must be added here too.
      KAPTAN_BOOTSTRAP_USERS: ${KAPTAN_BOOTSTRAP_USERS:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 20s
    restart: unless-stopped

  ingest_worker:
    <<: *app
    command: ["ingest_worker"]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 60s
    restart: on-failure

  agent_worker:
    <<: *app
    command: ["agent_worker"]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 60s
    restart: on-failure

  # The day's jobs (README "Scheduler"); the leader lock keeps a second copy waiting.
  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 60s
    restart: on-failure

  backup:
    image: pgvector/pgvector:pg16
    profiles: ["backup"]
    entrypoint: ["sh", "/ops/backup.sh"]
    environment:
      BACKUP_DATABASE_URL: postgresql://kaptan_owner:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kaptan}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      AGE_RECIPIENTS: ${AGE_RECIPIENTS:-}
    volumes:
      - ./ops:/ops:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

volumes:
  pgdata: {}
  redisdata: {}
